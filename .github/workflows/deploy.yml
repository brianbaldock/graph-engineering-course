name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test-labs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lab deps
        working-directory: labs
        run: pip install -r requirements.txt
      - name: Run lab tests
        working-directory: labs
        run: python -m pytest tests/ -q
      - name: Run the pipeline end to end
        working-directory: labs
        run: python -m graphlab.pipeline
      - name: Seed the demo graph and assert the documented baseline
        working-directory: labs
        run: python -m graphlab.seed /tmp/ci-memory.db
      - name: Verify the MCP server loads, enforces caps, and closes facts
        working-directory: labs
        run: python verify_mcp.py
      - name: Report the lesson word budget (prose versus code)
        run: python3 scripts/word_budget.py

  build:
    needs: test-labs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx astro check
      - name: Install Python deps for the verification gates
        # verify_citations and verify_test_counts both need real packages.
        # Without this the gates crash on the runner instead of checking
        # anything, which is the failure mode this course keeps warning about.
        run: pip install -r labs/requirements.txt
      - name: Verify analytics and feedback shipped
        # The GoatCounter failure mode is silent: if the script ever loses
        # is:inline, Astro bundles it, strips data-goatcounter, and pageviews
        # quietly go to zero with no error. Assert on the built HTML.
        run: python3 scripts/verify_integrations.py
      - name: Verify published test counts match the real suite
        # Two lessons shipped "15 passed" long after the suite hit 20.
        # Prose drifts; the suite does not lie. Compare them.
        run: python3 scripts/verify_test_counts.py
      - name: Verify every citation still resolves
        # A citation nobody checks is decoration. Fail the build on a
        # dead link, an uncited entry, or an empty registry.
        run: python3 scripts/verify_citations.py
      - name: Verify every CSS token resolves
        # The first CI run failed pa11y at 2.81:1 because a component used
        # var(--text-muted, #9a9a9a) and that token is defined nowhere, so
        # the hardcoded fallback always won and ignored the light theme.
        # An orphaned token is invisible in review; this makes it loud.
        run: python3 scripts/verify_css_tokens.py
      - name: Verify lesson prose against the code it describes
        # Added after I published "the validation gate thresholds on
        # confidence" when validate.py never mentions the field. Prose was
        # the one artifact no gate checked.
        run: python3 scripts/verify_claims.py
      - name: Verify published golden output matches the lab
        # Lesson 8 shipped a stale verify_mcp.py output while its own text
        # said a golden output that drifts is decoration. Run the commands
        # and diff against what is published.
        run: python3 scripts/verify_golden_output.py
      - name: Verify the collaboration disclaimer's numbers
        # The note states how long Brian and Hermes have worked together
        # and how much came out of it. Recompute from the record so the
        # figures cannot drift upward.
        run: python3 scripts/verify_collab_stats.py
      - name: Verify SEO metadata and structured data
        # Reads dist/, so it has to run after the build. Checks that every
        # page has a production canonical, that every ld+json block actually
        # parses, and that robots/sitemap shipped. Malformed structured data
        # is invisible in a browser and silently useless to a crawler, which
        # is exactly the class of failure worth gating on.
        run: python3 scripts/verify_seo.py
      - name: Accessibility check
        run: |
          # pa11y-ci drives a pinned puppeteer-core that demands one exact
          # Chrome build. Installing "chrome" alone pulls latest (151) and
          # still fails, so pin the version puppeteer-core resolves to and
          # point pa11y at that binary explicitly.
          CHROME_PATH=$(npx puppeteer browsers install chrome@148.0.7778.97 | awk '{print $2}')
          echo "Using Chrome at $CHROME_PATH"
          export PUPPETEER_EXECUTABLE_PATH="$CHROME_PATH"
          npx astro preview --port 4321 &
          npx wait-on http://localhost:4321/ -t 60000
          npx pa11y-ci --config .pa11yci.json
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
