name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test-labs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lab deps
        working-directory: labs
        run: pip install -r requirements.txt
      - name: Run lab tests
        working-directory: labs
        run: python -m pytest tests/ -q
      - name: Run the pipeline end to end
        working-directory: labs
        run: python -m graphlab.pipeline
      - name: Seed the demo graph and assert the documented baseline
        working-directory: labs
        run: python -m graphlab.seed /tmp/ci-memory.db
      - name: Verify the MCP server loads, enforces caps, and closes facts
        working-directory: labs
        run: python verify_mcp.py
      - name: Report the lesson word budget (prose versus code)
        run: python3 scripts/word_budget.py

  build:
    needs: test-labs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx astro check
      - name: Verify analytics and feedback shipped
        # The GoatCounter failure mode is silent: if the script ever loses
        # is:inline, Astro bundles it, strips data-goatcounter, and pageviews
        # quietly go to zero with no error. Assert on the built HTML.
        run: python3 scripts/verify_integrations.py
      - name: Accessibility check
        run: |
          # pa11y-ci drives a pinned puppeteer-core that demands one exact
          # Chrome build. Installing "chrome" alone pulls latest (151) and
          # still fails, so pin the version puppeteer-core resolves to and
          # point pa11y at that binary explicitly.
          CHROME_PATH=$(npx puppeteer browsers install chrome@148.0.7778.97 | awk '{print $2}')
          echo "Using Chrome at $CHROME_PATH"
          export PUPPETEER_EXECUTABLE_PATH="$CHROME_PATH"
          npx astro preview --port 4321 &
          npx wait-on http://localhost:4321/ -t 60000
          npx pa11y-ci --config .pa11yci.json
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
